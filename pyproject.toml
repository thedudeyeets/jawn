[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getdatjawn"
version = "0.1.0"
description = "Grab a tagged local audio file from a Spotify, YouTube Music, Apple Music, or Tidal URL."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Isaac McGinnis" }]
requires-python = ">=3.10"
keywords = ["music", "spotify", "youtube", "audio", "downloader", "tagging"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "yt-dlp",
    "mutagen",
    "requests",
]

[project.urls]
Homepage = "https://github.com/thedudeyeets/jawn"

[project.scripts]
getdatjawn = "getdatjawn:main"
jawn = "getdatjawn:main"

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools.packages.find]
where = ["src"]
